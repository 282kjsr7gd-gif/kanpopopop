<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漢方番号4択ドリル</title>
<style>
:root { color-scheme: light; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f7f8; --card:#fff; --blue:#2563eb; --good:#15803d; --bad:#dc2626; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif; color:var(--ink); background:var(--bg); }
.wrap { max-width:720px; margin:0 auto; padding:20px 16px 40px; }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
h1 { font-size:22px; margin:0; }
button { font:inherit; cursor:pointer; }
.small { color:var(--muted); font-size:13px; }
.stats { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 16px; }
.pill { background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 11px; font-size:13px; }
.bar { height:8px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-bottom:20px; }
.bar > div { height:100%; background:var(--blue); width:0%; transition:width .2s; }
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 20px 22px; box-shadow:0 5px 20px rgba(0,0,0,.04); }
.label { color:var(--muted); font-size:14px; text-align:center; }
.number { font-size:64px; font-weight:750; text-align:center; margin:10px 0 25px; letter-spacing:.02em; }
.question { text-align:center; font-size:18px; margin-bottom:16px; }
.answers { display:grid; gap:10px; }
.answer { border:1px solid #d1d5db; background:#fff; border-radius:13px; padding:14px 15px; text-align:left; transition:.12s; }
.answer:hover:not(:disabled) { border-color:#9ca3af; background:#fafafa; }
.answer:disabled { cursor:default; }
.answer.correct { border-color:var(--good); background:#ecfdf3; }
.answer.wrong { border-color:var(--bad); background:#fef2f2; }
.feedback { min-height:28px; text-align:center; margin:16px 0 0; font-weight:650; }
.feedback.good { color:var(--good); }
.feedback.bad { color:var(--bad); }
.actions { display:flex; gap:10px; margin-top:16px; }
.primary,.secondary { flex:1; border-radius:12px; padding:12px 14px; border:1px solid var(--line); }
.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
.secondary { background:#fff; }
.hidden { display:none; }
.result { text-align:center; padding:10px 0; }
.result h2 { margin:8px 0; }
.bigscore { font-size:46px; font-weight:750; margin:10px 0; }
.notice { margin-top:14px; color:var(--muted); font-size:12px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>漢方番号 4択ドリル</h1>
    <div class="small">番号を見て、対応する漢方名を選ぶ</div>
  </div>
  <button class="secondary" id="resetBtn">最初から</button>
</header>

<div class="stats">
  <div class="pill">問題 <span id="qnum">1</span>/<span id="total">66</span></div>
  <div class="pill">正解 <span id="correct">0</span></div>
  <div class="pill">正答率 <span id="rate">0%</span></div>
</div>
<div class="bar"><div id="bar"></div></div>

<section class="card" id="quiz">
  <div class="label">この番号の漢方名は？</div>
  <div class="number" id="number">—</div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <div class="actions">
    <button class="primary hidden" id="nextBtn">次の問題</button>
  </div>
</section>

<section class="card hidden" id="result">
  <div class="result">
    <div class="label">終了</div>
    <h2>今回の結果</h2>
    <div class="bigscore"><span id="finalCorrect">0</span> / 66</div>
    <div id="finalRate"></div>
    <div class="actions">
      <button class="primary" id="againBtn">もう一度</button>
      <button class="secondary" id="mistakesBtn">間違えた問題だけ</button>
    </div>
    <div class="notice">「間違えた問題だけ」は今回の結果を使います。ページを閉じるとリセットされます。</div>
  </div>
</section>
</div>

<script>
const ALL = [{"no": 5, "name": "安中散"}, {"no": 115, "name": "胃苓湯"}, {"no": 106, "name": "温経湯"}, {"no": 57, "name": "温清飲"}, {"no": 98, "name": "黄耆建中湯"}, {"no": 15, "name": "黄連解毒湯"}, {"no": 3, "name": "乙字湯"}, {"no": 1, "name": "葛根湯"}, {"no": 24, "name": "加味逍遙散"}, {"no": 65, "name": "帰脾湯"}, {"no": 77, "name": "芎帰膠艾湯"}, {"no": 50, "name": "荊芥連翹湯"}, {"no": 25, "name": "桂枝茯苓丸"}, {"no": 70, "name": "香蘇散"}, {"no": 107, "name": "牛車腎気丸"}, {"no": 31, "name": "呉茱萸湯"}, {"no": 17, "name": "五苓散"}, {"no": 10, "name": "柴胡桂枝湯"}, {"no": 96, "name": "柴朴湯"}, {"no": 114, "name": "柴苓湯"}, {"no": 103, "name": "酸棗仁湯"}, {"no": 93, "name": "滋陰降火湯"}, {"no": 75, "name": "四君子湯"}, {"no": 46, "name": "七物降下湯"}, {"no": 64, "name": "炙甘草湯"}, {"no": 68, "name": "芍薬甘草湯"}, {"no": 48, "name": "十全大補湯"}, {"no": 6, "name": "十味敗毒湯"}, {"no": 51, "name": "潤腸湯"}, {"no": 99, "name": "小建中湯"}, {"no": 9, "name": "小柴胡湯"}, {"no": 19, "name": "小青竜湯"}, {"no": 21, "name": "小半夏加茯苓湯"}, {"no": 30, "name": "真武湯"}, {"no": 58, "name": "清上防風湯"}, {"no": 136, "name": "清暑益気湯"}, {"no": 111, "name": "清心蓮子飲"}, {"no": 33, "name": "大黄牡丹皮湯"}, {"no": 100, "name": "大建中湯"}, {"no": 8, "name": "大柴胡湯"}, {"no": 97, "name": "大防風湯"}, {"no": 47, "name": "釣藤散"}, {"no": 61, "name": "桃核承気湯"}, {"no": 86, "name": "当帰飲子"}, {"no": 38, "name": "当帰四逆加呉茱萸生姜湯"}, {"no": 23, "name": "当帰芍薬散"}, {"no": 67, "name": "女神散"}, {"no": 32, "name": "人参湯"}, {"no": 108, "name": "人参養栄湯"}, {"no": 29, "name": "麦門冬湯"}, {"no": 7, "name": "八味地黄丸"}, {"no": 16, "name": "半夏厚朴湯"}, {"no": 14, "name": "半夏瀉心湯"}, {"no": 37, "name": "半夏白朮天麻湯"}, {"no": 20, "name": "防已黄耆湯"}, {"no": 62, "name": "防風通聖散"}, {"no": 41, "name": "補中益気湯"}, {"no": 27, "name": "麻黄湯"}, {"no": 127, "name": "麻黄附子細辛湯"}, {"no": 55, "name": "麻杏甘石湯"}, {"no": 126, "name": "麻子仁丸"}, {"no": 54, "name": "抑肝散"}, {"no": 43, "name": "六君子湯"}, {"no": 110, "name": "立効散"}, {"no": 76, "name": "龍胆瀉肝湯"}, {"no": 39, "name": "苓桂朮甘湯"}];
let deck=[], index=0, correct=0, answered=false, mistakes=[];

const $ = id => document.getElementById(id);
function shuffle(a) {
  const x=[...a];
  for(let i=x.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; }
  return x;
}
function makeOptions(correctCard) {
  const others=shuffle(ALL.filter(x=>x.no!==correctCard.no)).slice(0,3);
  return shuffle([correctCard,...others]);
}
function updateStats() {
  $("qnum").textContent=Math.min(index+1, deck.length);
  $("total").textContent=deck.length;
  $("correct").textContent=correct;
  const done=index;
  $("rate").textContent=(done ? Math.round(correct/done*100) : 0)+"%";
  $("bar").style.width=(deck.length ? (index/deck.length*100) : 0)+"%";
}
function render() {
  if(index>=deck.length) return finish();
  answered=false;
  const c=deck[index];
  $("number").textContent=c.no;
  $("feedback").textContent="";
  $("feedback").className="feedback";
  $("nextBtn").classList.add("hidden");
  $("answers").innerHTML="";
  makeOptions(c).forEach(opt=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=opt.name;
    b.addEventListener("click",()=>choose(b,opt,c));
    $("answers").appendChild(b);
  });
  updateStats();
}
function choose(btn,opt,c) {
  if(answered) return;
  answered=true;
  document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
  if(opt.no===c.no) {
    correct++;
    btn.classList.add("correct");
    $("feedback").textContent="正解";
    $("feedback").className="feedback good";
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(".answer").forEach(b=>{if(b.textContent===c.name)b.classList.add("correct");});
    mistakes.push(c);
    $("feedback").textContent="不正解　正解は「"+c.name+"」";
    $("feedback").className="feedback bad";
  }
  updateStats();
  $("nextBtn").classList.remove("hidden");
}
function next() { index++; render(); }
function start(list=ALL) {
  deck=shuffle(list);
  index=0; correct=0; mistakes=[];
  $("quiz").classList.remove("hidden");
  $("result").classList.add("hidden");
  render();
}
function finish() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("finalCorrect").textContent=correct;
  $("finalRate").textContent="正答率 "+Math.round(correct/deck.length*100)+"%";
  $("bar").style.width="100%";
}
$("nextBtn").addEventListener("click",next);
$("againBtn").addEventListener("click",()=>start(ALL));
$("mistakesBtn").addEventListener("click",()=>{
  if(mistakes.length===0) { alert("今回は全問正解です。"); return; }
  start(mistakes);
});
$("resetBtn").addEventListener("click",()=>start(ALL));
start(ALL);
</script>
</body>
</html>
